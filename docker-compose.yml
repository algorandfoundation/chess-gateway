services:

  vault:
    image: hashicorp/vault:1.15.6
    container_name: vault
    ports:
      - "8200:8200"
    restart: unless-stopped
    volumes:
      - ./volumes/vault/logs:/vault/logs
      - ./volumes/vault/file:/vault/file
    environment:
      VAULT_LOCAL_CONFIG: '{"storage": {"file": {"path": "/vault/file"}},"listener": {"tcp": {"address": "0.0.0.0:8200","tls_disable": true}},"ui": true, "disable_mlock": true}'
      VAULT_ADDR: http://127.0.0.1:8200
    cap_add:
      - IPC_LOCK
    command: server

  pawn:
    build:
      context: .
      dockerfile: ./Dockerfile
    image: pawn-dev
    working_dir: /opt/app
    command: sh -c 'yarn && yarn start:dev;'
    container_name: pawn
    env_file:
      - .env
    environment:
      NODE_HOST: algod
      NODE_PORT: "8080"
    volumes:
      - .:/opt/app/
      - /opt/app/node_modules
    ports:
      - "3000:3000"
    networks:
      - default
      - algokit_sandbox

  # CREDEBL trust registry (M2-b scaffold).
  #
  # Opt-in: `docker compose --profile credebl up`. Pinning a vendored
  # fork that wires the `libs/credo-did-algo` plugin into CREDEBL's
  # agent layer (so it accepts `did:algo` on issuer onboarding and
  # schema registration) is the remaining work for M2-b — once the
  # fork is published, override `CREDEBL_IMAGE` to its tag and the
  # full M2 loop closes. See `src/oid4vc/TRUST_MODEL.md` → M2.
  credebl:
    image: ${CREDEBL_IMAGE:-ghcr.io/credebl/platform:latest}
    container_name: credebl
    profiles:
      - credebl
    env_file:
      - .env
    environment:
      # Forwarded to Intermezzo so `CredeblTrustRegistryService` boots
      # against the local stack when `CREDEBL_ENABLED=true`.
      CREDEBL_BASE_URL: http://credebl:${CREDEBL_HOST_PORT:-3100}
    ports:
      - "${CREDEBL_HOST_PORT:-3100}:3100"
    restart: unless-stopped

networks:
  algokit_sandbox:
    external: true
    name: algokit_sandbox_default
